[package]
name = "pwm_loopback"
version = "0.1.0"
edition = "2024"

[workspace]

[[test]]
name = "pwm"
harness = false

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 2
panic = "abort"

[features]
default = ["backing-rtc"]
backing-rtc   = ["cxd56-hal/async-delay-rtc"]
backing-timer = ["cxd56-hal/async-delay-timer"]

[dependencies]
cortex-m     = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt  = "0.7.5"
cxd56-hal    = { version = "0.1.0", path = "../../cxd56-hal", default-features = false, features = ["rt", "critical-section"] }
defmt        = "1.1.0"
defmt-serial = "0.13"
defmt-test   = "0.5.0"
panic-probe  = { version = "1.0.0", features = ["print-defmt"] }
static_cell  = "2.1.1"
