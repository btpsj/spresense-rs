name: CI

# Builds the whole repo on every push / PR:
#   * the root workspace — embedded library crates for thumbv7em-none-eabihf
#     plus the host-side flashing tools,
#   * the standalone examples workspace (one member per link-level
#     configuration, incl. rust_burn_sine),
#   * the standalone on-hardware tests crate (compile-only — there is no board
#     in CI, so `--no-run` builds the firmware without invoking the flash runner).
#
# The BUILD/COMPILE steps are hard gates. clippy and rustfmt run too (per request)
# but are ADVISORY (`continue-on-error: true`): the repo currently carries
# pre-existing clippy debt (e.g. embassy-cxd56, flash-writer) and is largely
# hand-formatted (cxd56-hal and many others drift from rustfmt), so gating on them
# today would mean permanently-red CI. The lints still run and annotate; once the
# debt is burned down, drop the `continue-on-error` lines (and re-include cxd56-hal
# in fmt) to turn them into hard gates.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TARGET: thumbv7em-none-eabihf

jobs:
  # ---- root workspace: host-side flashing tools (std, need libudev) ----
  host-tools:
    name: Host tools (build + test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libudev (serialport dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --release -p mkspk -p flash-writer -p cargo-spresense-flash -p xtask
      - name: Test
        run: cargo test --locked --release -p mkspk -p flash-writer -p cargo-spresense-flash
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --locked -p mkspk -p flash-writer -p cargo-spresense-flash -p xtask -- -D warnings

  # ---- root workspace: embedded library crates (no_std, thumb target) ----
  embedded-crates:
    name: Embedded crates (build + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (svd2rust PAC backend)
        run: >
          cargo build --locked --release --target $TARGET --workspace
          --exclude mkspk --exclude flash-writer --exclude cargo-spresense-flash --exclude xtask
      - name: Build (chiptool PAC backend)
        run: cargo build --locked --release --target $TARGET -p cxd56-pac --no-default-features --features chiptool
      - name: Clippy (advisory)
        continue-on-error: true
        run: >
          cargo clippy --locked --target $TARGET --workspace
          --exclude mkspk --exclude flash-writer --exclude cargo-spresense-flash --exclude xtask -- -D warnings

  # ---- standalone examples workspace ----
  # No --locked: the standalone Cargo.lock is not kept in lockstep with the
  # manifests, so a frozen resolve would fail. The target + linker script come
  # from examples/.cargo/config.toml. One invocation per compatible member
  # group: cargo unifies dependency features across the packages it selects,
  # and cxd56-hal allows exactly one async-time backend per build, the
  # chiptool-PAC members must not see cortex-m-rt's `device` feature (flipped
  # on by the svd2rust PAC's `rt`), the SPH critical-section impl must not
  # meet cortex-m's single-core impl, and rust_burn_sine flips the GNSS bins'
  # memchr to std+alloc — so `--workspace` cannot work.
  examples:
    name: Examples (build + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build every example
        working-directory: examples
        run: |
          set -e
          cargo build --release -p examples-hal -p examples-embassy-time -p examples-pac-svd2rust -p examples-gnss
          cargo build --release -p examples-embassy-pac -p examples-pac-chiptool
          cargo build --release -p examples-async-delay
          cargo build --release -p examples-async-delay --no-default-features --features backing-timer
          cargo build --release -p examples-embassy-time --no-default-features --features time-timer
          cargo build --release -p examples-critical-section
          cargo build --release -p rust_burn_sine
      - name: Clippy every example (advisory)
        continue-on-error: true
        working-directory: examples
        run: |
          set -e
          cargo clippy --release -p examples-hal -p examples-embassy-time -p examples-pac-svd2rust -p examples-gnss -- -D warnings
          cargo clippy --release -p examples-embassy-pac -p examples-pac-chiptool -- -D warnings
          cargo clippy --release -p examples-async-delay -- -D warnings
          cargo clippy --release -p examples-async-delay --no-default-features --features backing-timer -- -D warnings
          cargo clippy --release -p examples-embassy-time --no-default-features --features time-timer -- -D warnings
          cargo clippy --release -p examples-critical-section -- -D warnings
          cargo clippy --release -p rust_burn_sine -- -D warnings

  # ---- standalone on-hardware tests crate (compile only) ----
  tests:
    name: Tests (compile-only + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Compile-only (no board in CI). Always select tests by name (--test <t>):
      # a bare `cargo test` would also build the lib/bin unit-test targets,
      # which pull in the `test` crate + a panic handler that do not exist on a
      # no_std target. --no-run builds the firmware without invoking the flash
      # runner. gpio/pwm and gpio_embassy need non-default features: cxd56-hal
      # allows exactly one async-time backend per build, and gpio_embassy links
      # embassy-cxd56 instead of cxd56-hal.
      - name: Compile the unified test crate
        working-directory: tests
        run: |
          set -e
          cargo build --release
          cargo test --release --no-run --test time
          cargo test --release --no-run --test spi
          cargo test --release --no-run --test i2s
          cargo test --release --no-run --test gpio --no-default-features --features backing-rtc
          cargo test --release --no-run --test pwm  --no-default-features --features backing-rtc
          cargo test --release --no-run --test gpio_embassy --no-default-features --features embassy-pac
      # No --tests/--all-targets here: they would include the libtest-requiring
      # unit-test targets (same no_std constraint as above).
      - name: Clippy the test crate (advisory)
        continue-on-error: true
        working-directory: tests
        run: |
          set -e
          cargo clippy --release --bins --test time --test spi --test i2s -- -D warnings
          cargo clippy --release --no-default-features --features backing-rtc --test gpio --test pwm -- -D warnings
          cargo clippy --release --no-default-features --features embassy-pac --test gpio_embassy -- -D warnings

  # ---- rustfmt (advisory: the repo is largely hand-formatted) ----
  fmt:
    name: Rustfmt (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # cxd56-hal is intentionally hand-formatted (documented rustfmt drift), so
      # it is excluded; `cargo fmt --all` cannot exclude a member, hence the
      # explicit package list.
      - name: Check root workspace formatting (cxd56-hal excluded)
        continue-on-error: true
        run: >
          cargo fmt --check
          -p cxd56-pac -p cxd56-pac-svd2rust -p cxd56-blink-debug
          -p embassy-cxd56 -p spresense-bsp
          -p mkspk -p flash-writer -p cargo-spresense-flash
      - name: Check examples and tests formatting
        continue-on-error: true
        run: |
          fail=0
          for d in examples/ tests/; do
            echo "::group::cargo fmt --check $d"
            ( cd "$d" && cargo fmt --check ) || { echo "::error::fmt drift: $d"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

  # ---- cargo-generate template: scaffold a project from it and build it ----
  template:
    name: Template (cargo generate + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-generate
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate
      # Generate into $RUNNER_TEMP (outside the repo workspace), then build. The
      # generated crate carries its own .cargo/config.toml pinning the thumb
      # target, so plain `cargo build` cross-compiles it. No --locked (it ships
      # no lockfile); `cargo build` (not `cargo run`) never invokes the flash
      # runner. The build pulls cxd56-hal from `main`, matching what a real user
      # of the template gets.
      - name: Generate a project from cxd56-template
        run: >
          cargo generate
          --path cxd56-template
          --name cxd56-template-ci
          --destination "$RUNNER_TEMP"
          --vcs none
          --no-workspace
      - name: Build the generated project
        working-directory: ${{ runner.temp }}/cxd56-template-ci
        run: cargo build --release
