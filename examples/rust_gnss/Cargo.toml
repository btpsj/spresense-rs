[package]
name = "rust_gnss"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
cxd56-hal = { path = "../../cxd56-hal", features = ["rt", "critical-section"] }
defmt = "1.1.0"
defmt-serial = "0.13"
# Bounded, alloc-free string assembly for the NMEA sentences.
heapless = "0.8"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 2
panic = "abort"
